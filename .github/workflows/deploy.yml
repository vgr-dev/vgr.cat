name: Deploy
# Deploys only after `CI` has passed on `main`.
#
# Branch protection was removed on 2026-10-16, so a push to `main` no longer waits for a passing check:
# with a `push` trigger, `CI` and `Deploy` start in parallel and Deploy could ship code CI would reject.
# Gating on `workflow_run` restores the ordering without re-adding protection.
#
# Two things this depends on:
#   * the triggering workflow is matched by NAME — renaming the `CI` workflow silently stops all deploys;
#   * the checkout pins the SHA `CI` validated, so a newer push landing mid-run is not deployed unverified.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  # Deliberate: interrupting a production deploy can leave the Worker inconsistent.
  cancel-in-progress: false

jobs:
  deploy:
    # `workflow_run` fires on failure too — deploy only on success. Success alone is NOT evidence of trust:
    # `CI` also runs on `pull_request`, and this job holds the Cloudflare credentials. Assert the triggering
    # event, branch AND repository so a pull request — including a fork branch literally named `main` — can
    # never be built and shipped from here. A manual dispatch must also come from `main`.
    # Consequence: a manually dispatched `CI` run no longer triggers a deploy; use `workflow_dispatch` on
    # this workflow instead.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    env:
      # Optional override. Unset is fine: the production sitekey is committed in
      # src/config.ts. Set it only to point a build at a different sitekey.
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      # Actions are pinned to immutable commit SHAs (audit M-2). The `# vX.Y.Z` comment is what lets
      # Dependabot keep updating the pin — never replace a SHA here with a major tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Exactly the commit `CI` validated. A manual dispatch carries no `workflow_run`
          # payload, so it falls back to the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Guard against a Turnstile test sitekey
        run: npm run check:production-env
      # `npm run build` is `astro check && astro build`, and `astro check` needs the
      # GENERATED worker-configuration.d.ts (gitignored) to resolve the `Env` binding
      # type. Only `npm run check` chains `npm run types`, and CI's validate job runs
      # that first — which is exactly why the missing step here stayed invisible until
      # a deploy failed on a fresh checkout with "Cannot find name 'Env'".
      - run: npm run types
      - run: npm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
